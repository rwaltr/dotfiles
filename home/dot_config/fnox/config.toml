# Global fnox config — chezmoi-managed. References only; no secret values here.
#
# TODO(rwaltr): replace TODO_VAULT and the TODO_ITEM/TODO_FIELD refs with the
# real 1Password locations, then run `fnox doctor` and `fnox check`.

# Keep secrets out of the interactive shell; only `fnox exec` children get them.
env = "exec"

[providers.op]
type = "1password"
vault = "home-ops"
# Read the service-account token from the keychain and hand it to `op`.
token = { secret = "OP_SERVICE_ACCOUNT_TOKEN" }

[providers.keychain]
type = "keychain"
service = "fnox"

# 1Password service-account token, held in the OS keychain. Bootstrap for the
# op provider; handed to `fnox mcp` by pi at spawn time.
[secrets.OP_SERVICE_ACCOUNT_TOKEN]
provider = "keychain"
value = "op-service-account-token"
description = "1Password service account token"

[secrets.OPENROUTER_API_KEY]
provider = "op"
value = "Openrouterpi/OPENROUTER_API_KEY"
description = "OpenRouter API key for pi model calls"

[secrets.HA_TOKEN]
provider = "op"
value = "haPi/HA_TOKEN"
description = "Home Assistant long-lived access token"

[secrets.GRAFANA_TOKEN]
provider = "op"
value = "grafana/GRAFANA_TOKEN"
description = "Grafana service account token"

[secrets.RADARR_API_KEY]
provider = "op"
value = "arr/radarr"
description = "Radarr API key (mcp-arr-server)"

[secrets.SONARR_API_KEY]
provider = "op"
value = "arr/sonarr"
description = "Sonarr API key (mcp-arr-server)"

# Agent access via `fnox mcp`, limited to these secrets.
[mcp]
tools = ["get_secret", "exec"]
secrets = ["OPENROUTER_API_KEY", "HA_TOKEN", "GRAFANA_TOKEN"]
redact_output = true
